name: Publish railway library
on:
  workflow_dispatch:
    inputs:
      source_preview_url:
        description: Complete current Tencent preview URL (only needed during this build)
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import and verify all 96 public website assets
        env:
          SOURCE_PREVIEW_URL: ${{ inputs.source_preview_url }}
        run: node import-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
